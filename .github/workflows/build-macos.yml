name: Build macOS App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "1.0.0"
  push:
    branches:
      - main
    paths:
      - "*.py"
      - "*.json"
      - "*.sh"
      - "*.spec"
      - "requirement.txt"
      - ".github/workflows/build-macos.yml"

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch_name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_name: Intel
            runner: macos-15-intel
            artifact_suffix: intel
          - arch_name: Apple-Silicon
            runner: macos-15
            artifact_suffix: apple-silicon

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirement.txt"

      - name: Build app
        shell: bash
        run: |
          chmod +x build_macos_release.sh
          ./build_macos_release.sh "${{ github.event.inputs.version || '1.0.0' }}"

      - name: Rename zip with architecture
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || '1.0.0' }}"
          mv "release/EEG_ECG_Analyzer_macOS_Portable_v${VERSION}.zip" \
             "release/EEG_ECG_Analyzer_macOS_${{ matrix.artifact_suffix }}_v${VERSION}.zip"

      - name: Upload macOS app zip
        uses: actions/upload-artifact@v4
        with:
          name: EEG_ECG_Analyzer_macOS_${{ matrix.artifact_suffix }}_v${{ github.event.inputs.version || '1.0.0' }}
          path: release/EEG_ECG_Analyzer_macOS_${{ matrix.artifact_suffix }}_v${{ github.event.inputs.version || '1.0.0' }}.zip
          if-no-files-found: error
